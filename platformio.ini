[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_resetmethod = nodemcu

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINOJSON_ENABLE_STD_STRING=1
